<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CelikFakta PdP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Susun atur: satu lajur bacaan di bawah bar kursus melekit; setiap unit memakai warna dimensinya; kuning penanda untuk perkara yang perlu disemak */
  --paper:#F2F4F9; --surface:#FFFFFF; --ink:#14213D; --muted:#56617D; --line:#D5DBE8;
  --marker:#FFD84A; --on-marker:#14213D; --accent:#1F3FA6; --on-accent:#FFFFFF; --tint:#E9EEFB;
  --kesahan:#1B5FA8; --ketepatan:#0B7A68; --bias:#A12C66;
  --good:#17754A; --good-bg:#E3F4EA; --warn:#8A5A00; --warn-bg:#FBF0D3; --bad:#B83227; --bad-bg:#FBE6E3;
  --font-display:'Poppins','Segoe UI',system-ui,sans-serif;
  --font-body:'Atkinson Hyperlegible','Segoe UI',system-ui,sans-serif;
  --dim:var(--accent);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#0F1626; --surface:#18223A; --ink:#E9EDF6; --muted:#A3AECA; --line:#2C3958;
    --accent:#9DB6FF; --on-accent:#0F1626; --tint:#1F2C4D;
    --kesahan:#7FB2F0; --ketepatan:#5FD0BC; --bias:#F08DB8;
    --good:#5ADB97; --good-bg:#14321F; --warn:#FFBD5C; --warn-bg:#38290C; --bad:#FF8273; --bad-bg:#3B1B18;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0F1626; --surface:#18223A; --ink:#E9EDF6; --muted:#A3AECA; --line:#2C3958;
  --accent:#9DB6FF; --on-accent:#0F1626; --tint:#1F2C4D;
  --kesahan:#7FB2F0; --ketepatan:#5FD0BC; --bias:#F08DB8;
  --good:#5ADB97; --good-bg:#14321F; --warn:#FFBD5C; --warn-bg:#38290C; --bad:#FF8273; --bad-bg:#3B1B18;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.6 var(--font-body);-webkit-text-size-adjust:100%}
h1,h2,h3,h4{font-family:var(--font-display);line-height:1.2;margin:0;text-wrap:balance}
h1{font-size:clamp(2rem,5vw,3rem);font-weight:700;letter-spacing:-.01em}
h2{font-size:1.4rem;font-weight:600}
h3{font-size:1.08rem;font-weight:600}
p{margin:0}
a{color:var(--accent)}
mark{background:var(--marker);color:var(--on-marker);padding:0 .18em;border-radius:3px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
:focus-visible{outline:3px solid var(--marker);outline-offset:2px;border-radius:4px}
.wrap{max-width:900px;margin:0 auto;padding:0 20px}

/* bar kursus */
.bar{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{max-width:1100px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:20px;min-height:58px}
.brand{font:700 1.05rem var(--font-display);color:var(--ink);text-decoration:none;white-space:nowrap;display:flex;align-items:center;gap:8px}
.brand i{display:inline-block;width:22px;height:12px;background:var(--marker);border-radius:2px;transform:rotate(-8deg)}
.nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-left:auto}
.nav::-webkit-scrollbar{display:none}
.nav a{font:500 .88rem var(--font-display);color:var(--muted);text-decoration:none;padding:8px 10px;border-radius:8px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.nav a:hover{color:var(--ink);background:var(--tint)}
.nav a[aria-current="page"]{color:var(--ink);background:var(--tint)}
.nav .st{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
.nav .st.done{background:var(--good)}
.nav .st.lock{background:none;border:1.5px solid var(--muted)}

main{padding:36px 0 64px}
main section{margin-top:44px}
.eyebrow{font:600 .8rem var(--font-display);letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.lead{font-size:1.15rem;color:var(--muted);max-width:62ch}
.hero{margin-top:8px;display:flex;flex-direction:column;gap:16px}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:6px}
.btn{font:600 .95rem var(--font-display);background:var(--accent);color:var(--on-accent);border:2px solid var(--accent);border-radius:10px;padding:10px 20px;text-decoration:none;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.small{padding:6px 12px;font-size:.85rem}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 22px}
.stack{display:flex;flex-direction:column;gap:14px}
.muted{color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;font:600 .75rem var(--font-display);padding:3px 10px;border-radius:99px;background:var(--tint);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.dim{background:transparent;border:1.5px solid var(--dim);color:var(--dim)}

/* laluan */
.path{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.path a{display:grid;grid-template-columns:38px 1fr auto;gap:14px;align-items:center;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--dim);border-radius:12px;padding:14px 18px}
.path a:hover{border-color:var(--dim)}
.path .num{font:700 1.3rem var(--font-display);color:var(--dim);font-variant-numeric:tabular-nums}
.path b{font:600 1rem var(--font-display);display:block}
.path small{color:var(--muted);font-size:.9rem}
.dims{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:16px}
.dims .card{border-top:5px solid var(--dim);display:flex;flex-direction:column;gap:10px}
.dims ul{margin:0;padding-left:1.1em;color:var(--muted);font-size:.95rem}
.outcomes{margin:14px 0 0;padding-left:1.3em;max-width:68ch}
.outcomes li{margin:6px 0}

/* soalan */
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--dim);border-radius:99px}
.scen{border-left:4px solid var(--marker);background:var(--surface);padding:14px 18px;border-radius:0 10px 10px 0;font-style:italic;overflow-wrap:anywhere}
.q{font:600 1.08rem/1.45 var(--font-display)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:32px 1fr;gap:12px;align-items:start;text-align:left;font:inherit;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;overflow-wrap:anywhere}
.opt:hover:not([disabled]){border-color:var(--dim)}
.opt .ltr{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:600 .9rem var(--font-display);background:var(--tint);color:var(--muted)}
.opt.sel{border-color:var(--dim);background:var(--tint)}
.opt.sel .ltr{background:var(--dim);color:var(--surface)}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.right .ltr{background:var(--good);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .ltr{background:var(--bad);color:var(--surface)}
.opt[disabled]{cursor:default}
.why{border-radius:10px;padding:10px 14px;font-size:.96rem}
.why.good{background:var(--good-bg)} .why.bad{background:var(--bad-bg)} .why.warn{background:var(--warn-bg)}
.why b{font-family:var(--font-display);font-weight:600}
.why.good b{color:var(--good)} .why.bad b{color:var(--bad)} .why.warn b{color:var(--warn)}
.rowbtn{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* skor */
.scores{display:flex;flex-direction:column;gap:16px}
.score-row{display:grid;grid-template-columns:110px 1fr;gap:6px 16px;align-items:center}
.score-row h3{color:var(--dim)}
.bars{display:flex;flex-direction:column;gap:6px}
.barline{display:grid;grid-template-columns:86px 1fr 34px;gap:10px;align-items:center;font-size:.86rem;color:var(--muted)}
.track{height:14px;background:var(--line);border-radius:4px;overflow:hidden}
.track i{display:block;height:100%;background:var(--dim);border-radius:4px}
.track.pre i{opacity:.45}
.barline b{font:600 .9rem var(--font-display);color:var(--ink);font-variant-numeric:tabular-nums;text-align:right}

/* unit */
.unit-head{display:flex;flex-direction:column;gap:12px}
.objs{margin:4px 0 0;padding-left:1.2em;max-width:68ch}
.sec-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px;padding-bottom:10px;border-bottom:2px solid var(--dim)}
.sec-head .n{font:700 1.4rem var(--font-display);color:var(--dim)}
.sec-head .t{margin-left:auto;font:500 .85rem var(--font-display);color:var(--muted)}
.video-box{background:#0F1A33;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.video-box video{display:block;width:100%;height:auto;aspect-ratio:16/9;background:#0F1A33}
details{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 18px}
summary{font:600 .95rem var(--font-display);cursor:pointer}
details ol{margin:10px 0 4px;padding-left:1.3em}
.topics{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.topics .card{display:flex;flex-direction:column;gap:8px}
.topics .tn{font:600 .8rem var(--font-display);color:var(--dim);letter-spacing:.08em}
.tool{font-size:.92rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px;margin-top:auto}
.tool b{color:var(--ink);font-family:var(--font-display);font-weight:600;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:600 .88rem var(--font-display);background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:99px;padding:6px 14px;cursor:pointer}
.chip:hover:not([disabled]){border-color:var(--dim)}
.chip.right{border-color:var(--good);background:var(--good-bg);color:var(--good)}
.chip.wrong{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.chip[disabled]{cursor:default}
.item{display:flex;flex-direction:column;gap:10px}
.item + .item{border-top:1px solid var(--line);padding-top:16px}
textarea,input[type=text]{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:92px;resize:vertical}
label{font:600 .92rem var(--font-display);display:block;margin-bottom:6px}
code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92em;background:var(--tint);padding:1px 6px;border-radius:5px;overflow-wrap:anywhere}
.srcs{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.src{background:var(--paper);border:1px solid var(--line);border-top:4px solid var(--dim);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.src b{font:600 .95rem var(--font-display);color:var(--dim)}
.src small{color:var(--muted);font-size:.86rem}
.src p{font-style:italic;overflow-wrap:anywhere}
.voice{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:.92rem}
.unit-nav{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:44px}

/* kit alat */
.kit{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px;margin-top:16px}
.kit ol{margin:8px 0 0;padding-left:1.3em}
.kit li{margin:6px 0}
.links{list-style:none;margin:16px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
.links a{display:block;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.links a:hover{border-color:var(--accent)}
.links a{display:flex;gap:14px;align-items:center}
.ticon{position:relative;width:40px;height:40px;flex:none;border-radius:10px;background:var(--tint);display:grid;place-items:center;overflow:hidden}
.ticon i{font:600 1.05rem var(--font-display);font-style:normal;color:var(--accent)}
.ticon img{position:absolute;inset:0;width:100%;height:100%;padding:6px;background:#fff;object-fit:contain}
.links b{font:600 .98rem var(--font-display);display:block;color:var(--accent)}
.links small{color:var(--muted);font-size:.88rem}

/* lencana & sijil */
.badges{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-top:16px}
.badge{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.badge .disc{width:52px;height:52px;border-radius:50%;flex:none;display:grid;place-items:center;font:700 1.2rem var(--font-display);border:3px dashed var(--line);color:var(--muted)}
.badge.on .disc{background:var(--dim);border:3px solid var(--dim);color:var(--surface)}
.badge b{font:600 1rem var(--font-display);display:block}
.cert-tools{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:flex-end;margin-top:14px}
.cert{container-type:inline-size;position:relative;width:100%;aspect-ratio:297/210;margin-top:16px;background:#fff;color:#14213D;border:1px solid var(--line);border-radius:6px;overflow:hidden;font-family:var(--font-body);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.cert-band{position:absolute;left:0;top:0;bottom:0;width:7cqw;background:#14213D}
.cert-band::after{content:"";position:absolute;left:1.6cqw;top:6.2cqw;width:3.8cqw;height:1.9cqw;background:#FFD84A;border-radius:.3cqw;transform:rotate(-8deg)}
.cert-in{position:absolute;left:7cqw;top:0;right:0;bottom:0;padding:5.4cqw 6.4cqw 4.8cqw;display:flex;flex-direction:column}
.cert-in::before{content:"";position:absolute;inset:1.7cqw;border:.25cqw solid #FFD84A;pointer-events:none}
.cert-top{display:flex;justify-content:space-between;align-items:baseline;gap:2cqw;font:600 1.9cqw var(--font-display)}
.cert-no{font:400 1.35cqw var(--font-body);color:#56617D;font-variant-numeric:tabular-nums}
.cert-title{font:700 7.4cqw/1 var(--font-display);letter-spacing:-.01em;margin-top:4cqw}
.cert-sub{font:600 1.8cqw var(--font-display);letter-spacing:.16em;text-transform:uppercase;color:#1F3FA6;margin-top:1.1cqw}
.cert-pre{font-size:1.9cqw;color:#56617D;margin-top:3.2cqw}
.cert-name{font:700 4.4cqw/1.2 var(--font-display);margin-top:.8cqw;align-self:flex-start;max-width:100%;min-width:32cqw;min-height:5.3cqw;padding:0 .9cqw;overflow-wrap:anywhere;background:linear-gradient(#FFD84A,#FFD84A) no-repeat 0 100%/100% 1.6cqw}
.cert-body{font-size:1.9cqw;line-height:1.5;max-width:68cqw;margin-top:2.2cqw}
.cert-dims{display:flex;gap:1.6cqw;margin-top:2.2cqw}
.cert-dim{display:flex;align-items:center;gap:1cqw;border:.22cqw solid var(--c);border-radius:99cqw;padding:.6cqw 1.9cqw .6cqw .7cqw;font:600 1.75cqw var(--font-display);color:var(--c)}
.cert-dim i{width:3.2cqw;height:3.2cqw;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-style:normal;font-size:1.5cqw}
.cert-foot{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;gap:2cqw;font-size:1.45cqw;color:#56617D}
.cert-foot b{display:block;font:600 1.8cqw var(--font-display);color:#14213D}
@page sijil{size:A4 landscape;margin:0}
@media print{
  body.has-cert{background:#fff}
  body.has-cert .bar,body.has-cert footer{display:none}
  body.has-cert main{padding:0}
  body.has-cert .wrap{max-width:none;padding:0}
  body.has-cert #app > *{display:none}
  body.has-cert #app > .cert-sec{display:block;margin:0;page:sijil}
  body.has-cert .cert-sec > *{display:none}
  body.has-cert .cert-sec > .cert{display:block;width:297mm;height:209mm;aspect-ratio:auto;margin:0;border:0;border-radius:0;break-inside:avoid;break-after:avoid}
  html:has(body.has-cert),body.has-cert{margin:0;height:auto}
}

footer{border-top:1px solid var(--line);padding:22px 0 40px;color:var(--muted);font-size:.9rem}
footer .wrap{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.linkbtn{font:inherit;color:var(--accent);background:none;border:0;padding:0;text-decoration:underline;cursor:pointer}
@media (max-width:560px){
  body{font-size:16px}
  .score-row{grid-template-columns:1fr}
  .path a{grid-template-columns:30px 1fr}
  .path .pill{grid-column:2;justify-self:start}
  .sec-head .t{margin-left:0;width:100%}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <a class="brand" href="#utama"><i></i>CelikFakta PdP</a>
    <nav class="nav" id="nav" aria-label="Halaman modul"></nav>
  </div>
</header>
<main><div class="wrap" id="app"></div></main>
<footer>
  <div class="wrap">
    <span id="footNote">Prototaip. Kemajuan disimpan pada pelayar ini sahaja.</span>
    <span style="display:flex;gap:18px;flex-wrap:wrap">
      <button class="linkbtn" id="resetBtn" type="button">Set semula kemajuan</button>
    </span>
  </div>
</footer>

<script>
/* ================= KANDUNGAN ================= */
const ORDER = ['kesahan', 'ketepatan', 'bias'];

const U = {
 kesahan: {
  n:1, name:'Kesahan', q:'Siapa yang berkata, dan adakah mereka layak?', file:'unit1-kesahan',
  intro:'Unit ini melatih anda menentukan sama ada sesuatu sumber sah sebelum menilai isinya, menggunakan teknik bacaan lateral: keluar dari laman itu untuk menyemak siapa di belakangnya.',
  objs:['Menilai kepakaran penulis mengikut bidang.','Membezakan jurnal berwasit, jurnal pemangsa dan bukti anekdot.','Mengesan domain palsu.','Mengesan tanda media sintetik.'],
  hook:{s:'Seorang individu bergelar Profesor Doktor (PhD) dalam Kejuruteraan Mekanikal menulis hantaran panjang di media sosial. Beliau mendakwa disleksia hanyalah "kemalasan membaca" dan bukan gangguan neurologi. Hantaran itu dikongsi 12,400 kali.',
        q:'Adakah hantaran ini sah dirujuk untuk intervensi pendidikan khas?', o:['Ya','Tidak pasti','Tidak'],
        r:'Gelaran dan bilangan perkongsian bukan ukuran kesahan. Kepakaran beliau berada di luar bidang neurologi, psikologi dan pendidikan khas. Video di bawah menunjukkan cara menyemaknya langkah demi langkah.'},
  script:['Sebelum menilai isi, nilai dahulu sumbernya.','Bacaan lateral: buka tab baharu dan semak apa kata pihak lain tentang penulis atau penerbit.','Autoriti: gelaran akademik bukan kepakaran dalam semua bidang. Semak profil di laman universiti, Google Scholar atau ORCID.','Kualiti bukti: anekdot paling lemah, meta-analisis paling kukuh. Jurnal pemangsa menerbitkan apa sahaja asalkan dibayar.','Domain: domain sebenar ialah bahagian terakhir sebelum garis condong pertama. HTTPS dan logo rasmi boleh ditiru.','Media: wajah dan suara boleh dijana AI. Sahkan dengan sumber rasmi sebelum percaya atau berkongsi.','Ringkasan Kad SIFT: Berhenti, Siasat sumber, Cari liputan lain, Jejak ke asal.'],
  topics:[
   ['1.1','Autoriti & kepakaran','Kelayakan dalam bidang berbanding luar bidang, dan afiliasi institusi penulis.','Profil di laman universiti, Google Scholar, ORCID'],
   ['1.2','Proses penerbitan & kualiti bukti','Piramid bukti daripada anekdot hingga meta-analisis, serta ciri jurnal pemangsa.','Think. Check. Submit., indeks Scopus atau Web of Science'],
   ['1.3','Ketulenan domain & laman','Struktur domain rasmi seperti .gov.my dan .edu.my. HTTPS bukan bukti laman itu sah.','Baca domain sebelum garis condong pertama; taip sendiri alamat rasmi'],
   ['1.4','Ketulenan media','Deepfake audio dan video, gambar lama yang dikitar semula, imej janaan AI.','Carian imej songsang (Google Lens, TinEye), sebenarnya.my, BERNAMA']],
  act:{name:'Detektif Sumber', d:'Empat item sampai ke telefon anda hari ini. Gunakan Kad SIFT dan beri keputusan bagi setiap satu.', o:['Sah','Diragui','Tidak sah'],
   items:[
    {t:'Hantaran Facebook seorang "pakar motivasi terkenal" mendakwa murid kidal lebih lemah dalam matematik. Tiada rujukan atau institusi dinyatakan.', a:1, w:'Tiada kelayakan dalam bidang dan tiada rujukan. Dakwaan belum boleh digunakan sehingga sumber asalnya ditemui.'},
    {t:'Artikel dalam jurnal yang tersenarai dalam Scopus, melalui semakan rakan sebaya, ditulis pensyarah fakulti pendidikan tentang strategi bacaan awal.', a:0, w:'Penulis dalam bidang, jurnal berindeks dan berwasit. Sumber ini sah untuk dirujuk; isinya masih perlu dibaca secara kritis.'},
    {t:'Mesej Telegram meminta anda mengisi borang tuntutan elaun di https://moe-gov-my.elaunguru.info/borang', a:2, w:'Domain sebenar ialah elaunguru.info. Bahagian "moe-gov-my" hanya subdomain yang menyamar. Laman rasmi sektor awam berakhir dengan .gov.my.'},
    {t:'Klip video tular menunjukkan seorang tokoh mengumumkan cuti sekolah tambahan. Gerak bibir tidak selari dengan audio dan tiada kenyataan di laman rasmi.', a:1, w:'Ada tanda media sintetik dan tiada pengesahan rasmi. Jangan kongsi sehingga kementerian atau agensi berita rasmi mengesahkannya.'}]},
  quiz:[
   {q:'Satu infografik tular memetik "Dr. Aina, Pakar Pendidikan" yang mendakwa kaedah hafalan merosakkan otak kanak-kanak. Tiada institusi atau rujukan dinyatakan. Apakah langkah pertama yang paling wajar?',
    o:['Kongsikan dengan nota "belum disahkan" supaya rakan boleh membantu menyemak.','Cari nama, afiliasi dan penerbitan Dr. Aina di luar infografik itu sebelum menilai dakwaannya.','Terima dakwaan kerana gelaran "Dr." menunjukkan latar akademik.','Nilai dakwaan berdasarkan bilangan perkongsian infografik tersebut.'], key:1,
    w:'Bacaan lateral menyemak autoriti sumber dahulu. Gelaran dan populariti bukan bukti kepakaran.'},
   {q:'Antara berikut, bukti manakah paling kukuh untuk menyokong keputusan melaksanakan program intervensi membaca di sekolah?',
    o:['Testimoni 10 ibu bapa di laman Facebook syarikat program itu.','Video guru yang menunjukkan peningkatan seorang murid.','Meta-analisis dalam jurnal berwasit yang menggabungkan 25 kajian berkawalan.','Artikel blog pendidikan yang paling banyak dibaca tahun ini.'], key:2,
    w:'Meta-analisis kajian berkawalan berada di puncak piramid bukti. Testimoni dan kes tunggal ialah anekdot.'},
   {q:'Anda menerima e-mel "Kemas kini Data Guru" dengan pautan https://moe.gov.my.kemaskini-data.com/guru. Apakah domain sebenar laman ini?',
    o:['moe.gov.my','gov.my','kemaskini-data.com','guru'], key:2,
    w:'Domain sebenar ialah bahagian terakhir sebelum garis condong pertama. "moe.gov.my" di sini hanya subdomain yang menyamar.'},
   {q:'Sebuah jurnal dalam talian menerima artikel anda dalam 3 hari tanpa komen penilai, meminta bayaran segera, dan tidak tersenarai dalam mana-mana indeks. Apakah kesimpulan paling tepat?',
    o:['Jurnal itu cekap dan sesuai untuk penerbitan pantas.','Jurnal itu menunjukkan ciri jurnal pemangsa; kesahan artikelnya perlu diragui.','Jurnal itu sah selagi mempunyai nombor ISSN.','Bayaran membuktikan jurnal itu profesional.'], key:1,
    w:'Tiada semakan rakan sebaya, kelajuan luar biasa dan bayaran tanpa indeks ialah tanda jurnal pemangsa. ISSN sahaja tidak menjamin kualiti.'},
   {q:'Satu gambar banjir di sekolah tular dengan kapsyen "Berlaku pagi tadi". Apakah cara paling berkesan mengesahkan gambar ini?',
    o:['Membesarkan gambar untuk melihat kejelasan piksel.','Melakukan carian imej songsang untuk melihat bila dan di mana gambar itu mula-mula diterbitkan.','Bertanya dalam kumpulan WhatsApp sekolah sama ada sesiapa pernah melihatnya.','Menyemak bilangan komen yang mengesahkan kejadian.'], key:1,
    w:'Carian imej songsang mendedahkan asal dan tarikh terbitan pertama, lalu mengesan gambar lama yang dikitar semula.'}]
 },
 ketepatan: {
  n:2, name:'Ketepatan', q:'Adakah fakta, angka dan konteksnya betul?', file:'unit2-ketepatan',
  intro:'Unit ini melatih anda menyemak isi maklumat: menjejak sumber primer, memastikan maklumat masih terkini, membaca data dan graf dengan betul, dan mengesahkan output AI generatif.',
  objs:['Menjejak statistik ke sumber asal.','Menilai kesesuaian konteks dan masa.','Mengesan herotan data, terjemahan dan visualisasi.','Mengesahkan fakta dan sitasi janaan AI.'],
  hook:{s:'Sebuah portal berita melaporkan "78% pelajar sekolah menengah di Malaysia mengalami kemerosotan fokus akademik akibat video pendek melebihi 4 jam sehari". Sumbernya ditulis sebagai "Satu Kajian Universiti Tempatan 2025".',
        q:'Bolehkah angka ini terus dipetik dalam kertas kerja intervensi sekolah?', o:['Boleh','Tidak pasti','Belum boleh'],
        r:'Belum boleh. Universiti, saiz sampel dan pautan jurnal tidak dinyatakan, jadi angka itu belum dapat disahkan. Video di bawah menunjukkan cara menjejaknya ke sumber asal.'},
  script:['Angka yang spesifik kelihatan meyakinkan, tetapi tanpa butiran sumber ia belum boleh dipetik.','Jejak ke sumber primer: tiga portal yang mengulang angka sama ialah satu sumber, bukan tiga bukti.','Konteks dan masa: maklumat yang betul dahulu belum tentu betul sekarang. Rujuk pekeliling rasmi terkini.','Graf: semak di mana paksi-Y bermula. Skala yang dipotong membesarkan jurang kecil.','Korelasi bukan sebab-akibat: bandingkan tajuk dengan apa yang kajian asal benar-benar nyatakan.','Output AI: format yang kemas bukan bukti rujukan itu wujud. Sahkan setiap judul dan DOI.','Ringkasan empat soalan: Dari mana angka ini? Masih terkini? Apa kata data sebenar? Output AI sudah disahkan?'],
  topics:[
   ['2.1','Jejak ke sumber primer','Sumber primer berbanding sekunder. Frasa "satu kajian mendapati" tanpa butiran ialah tanda amaran.','Google Scholar, OpenDOSM, portal data KPM'],
   ['2.2','Ketepatan konteks & masa','Tarikh terbitan, pindaan dasar dan petikan di luar konteks.','Surat pekeliling terkini, Wayback Machine'],
   ['2.3','Membaca data & graf','Korelasi berbanding sebab-akibat, saiz sampel, peratus berbanding nombor sebenar, paksi-Y terpotong.','Senarai semak 5 Soalan Graf dalam Kit Alat'],
   ['2.4','Ketepatan output AI','Halusinasi, sitasi rekaan dan fakta lapuk dalam jawapan AI generatif.','doi.org atau Crossref; sahkan sendiri sumber yang AI nyatakan']],
  act:{name:'Kuiz Perbandingan Sumber', label:'Pembelajaran kendiri', kind:'banding', key:'banding',
   d:'Setiap soalan memaparkan dua sumber digital tentang isu pendidikan yang sama. Bandingkan faktanya, kenal pasti percanggahan, kemudian pilih jawapan. Maklum balas dan penjelasan dipaparkan serta-merta.',
   note:'Semua sumber dalam kuiz ini ialah contoh rekaan untuk tujuan latihan.',
   items:[
    {isu:'Penggunaan telefon pintar dalam kalangan murid sekolah rendah',
     a:['Hantaran media sosial, Mac 2026', '"TERKINI: 85% murid sekolah rendah ketagih telefon pintar! Kajian membuktikan." Tiada nama kajian dan tiada pautan.'],
     b:['Laporan tinjauan sebuah universiti awam, Januari 2026', '"Daripada 1,200 murid Tahun 4 hingga 6 di 20 buah sekolah, 38% melaporkan penggunaan telefon pintar melebihi 3 jam sehari pada hari persekolahan." Soal selidik dan kaedah persampelan dilampirkan.'],
     q:'Apakah percanggahan antara dua sumber ini, dan sumber manakah yang wajar dipetik?',
     o:['Tiada percanggahan sebenar kerana kedua-duanya menunjukkan murid banyak menggunakan telefon pintar.',
        'Angka dan istilahnya berbeza (85% "ketagih" berbanding 38% "melebihi 3 jam sehari"). Sumber B wajar dipetik kerana sampel dan kaedahnya dinyatakan serta boleh disemak.',
        'Sumber A wajar dipetik kerana tarikhnya lebih terkini daripada Sumber B.',
        'Purata kedua-dua angka, iaitu kira-kira 62%, ialah nilai paling selamat untuk dipetik.'], key:1,
     w:'Sumber A memberi angka tanpa kajian yang boleh dijejak dan menukar "penggunaan melebihi 3 jam" kepada "ketagih". Sumber B ialah sumber primer: saiz sampel, kumpulan murid dan kaedahnya boleh disemak. Mempuratakan dua angka yang mengukur perkara berbeza tidak menghasilkan fakta.'},
    {isu:'Had maksimum geran inovasi PdP untuk guru',
     a:['Blog seorang guru, kemas kini terakhir 2021', '"Had maksimum geran inovasi PdP ialah RM2,000 bagi setiap projek."'],
     b:['Laman rasmi penganjur geran, garis panduan 2026', '"Mulai 2026, had maksimum geran ialah RM5,000 bagi setiap projek. Garis panduan 2021 tidak lagi terpakai."'],
     q:'Mengapakah kedua-dua sumber ini bercanggah, dan apakah tindakan yang tepat?',
     o:['Salah satu sumber pasti palsu, jadi kedua-duanya patut ditolak.',
        'Gunakan RM2,000 kerana angka yang lebih rendah lebih selamat.',
        'Kedua-duanya betul pada masa masing-masing, tetapi Sumber A sudah lapuk. Rujuk garis panduan terkini pada sumber rasmi.',
        'Gunakan Sumber A kerana penulisnya seorang guru yang berpengalaman.'], key:2,
     w:'Percanggahan ini berpunca daripada masa, bukan pemalsuan. Maklumat dalam Sumber A tepat pada 2021 tetapi telah diganti. Semak tarikh setiap sumber dan sahkan dengan dokumen rasmi yang sedang berkuat kuasa.'},
    {isu:'Kesan kelas tambahan petang terhadap markah murid',
     a:['Artikel portal pendidikan', '"Kelas tambahan petang TERBUKTI menaikkan markah: murid yang hadir memperoleh purata 72 markah, berbanding 61 markah bagi murid yang tidak hadir."'],
     b:['Laporan asal kajian yang sama', '"Murid memilih sendiri sama ada untuk hadir. Sebelum program bermula, purata murid yang hadir ialah 70 markah dan yang tidak hadir 60 markah. Kajian ini tidak dapat menentukan hubungan sebab-akibat."'],
     q:'Apakah yang didedahkan apabila kedua-dua sumber ini dibandingkan?',
     o:['Angka 72 dan 61 itu betul, tetapi Sumber A meninggalkan konteks: jurang itu sudah wujud sebelum program, jadi dakwaan "terbukti menaikkan markah" tidak disokong.',
        'Angka dalam Sumber A salah dan telah direka oleh penulis artikel.',
        'Sumber B membuktikan kelas tambahan tidak memberi sebarang manfaat.',
        'Kedua-dua sumber bersetuju bahawa kelas tambahan menaikkan markah.'], key:0,
     w:'Kumpulan yang hadir naik 2 markah (70 kepada 72) dan kumpulan yang tidak hadir naik 1 markah (60 kepada 61). Daripada jurang 11 markah yang ditonjolkan Sumber A, 10 markah sudah wujud sebelum program. Sumber B tidak menafikan manfaat; ia hanya menyatakan sebab-akibat tidak dapat ditentukan.'},
    {isu:'Sokongan guru terhadap penggunaan AI dalam penilaian murid',
     a:['Ringkasan AI generatif tentang sebuah laporan', '"Laporan itu mendapati 9 daripada 10 guru menyokong penggunaan AI dalam penilaian murid (halaman 45)."'],
     b:['Laporan asal, halaman 45', '"9 daripada 10 guru yang ditinjau pernah mencuba alat AI. 4 daripada 10 menyokong penggunaannya dalam penilaian murid."'],
     q:'Apakah kesilapan dalam ringkasan AI itu?',
     o:['Tiada kesilapan kerana angka "9 daripada 10" memang wujud pada halaman 45.',
        'Laporan asal yang silap kerana AI merumuskan daripada lebih banyak data.',
        'Rujukan halaman yang diberikan membuktikan ringkasan itu tepat.',
        'AI melekatkan angka yang betul pada dakwaan yang salah: 9 daripada 10 pernah mencuba AI, tetapi hanya 4 daripada 10 menyokongnya dalam penilaian.'], key:3,
     w:'Ringkasan AI boleh menggabungkan dua dapatan menjadi satu ayat yang kedengaran meyakinkan. Angka dan nombor halaman yang betul bukan jaminan dakwaannya betul. Baca ayat penuh pada sumber asal sebelum memetik.'}]},
  quizVer:2,
  quizNote:'Setiap soalan memaparkan dua sumber digital tentang isu pendidikan yang sama. Bandingkan faktanya dan analisis percanggahannya sebelum memilih jawapan. Semua sumber ialah contoh rekaan untuk tujuan penilaian.',
  quiz:[
   {isu:'Keberkesanan program celik huruf di sebuah sekolah',
    a:['Artikel buletin pendidikan', '"Kadar celik huruf murid meningkat 50% selepas program ini dilaksanakan!"'],
    b:['Laporan program sekolah (sumber asal)', '"Bilangan murid Tahun 1 yang mencapai tahap minimum meningkat daripada 2 orang kepada 3 orang, daripada 28 murid dalam kelas."'],
    q:'Apakah kesimpulan paling tepat apabila kedua-dua sumber ini dibandingkan?',
    o:['Sumber A salah mengira peratus peningkatan.',
       'Peratus dalam Sumber A betul, tetapi mengelirukan kerana nilai asal dan saiz kumpulan yang kecil tidak dinyatakan.',
       'Kedua-dua sumber bercanggah, jadi salah satu daripadanya pasti palsu.',
       'Sumber A lebih tepat kerana peratus lebih mudah difahami daripada bilangan murid.'], key:1,
    w:'Peningkatan daripada 2 kepada 3 orang memang 50%, jadi kedua-dua sumber tidak bercanggah. Namun tanpa nilai asal dan saiz kelas, pembaca Sumber A mendapat gambaran yang dibesar-besarkan.'},
   {isu:'Sokongan guru terhadap buku teks digital',
    a:['Tinjauan di laman media sosial sebuah kumpulan guru', '"92% guru menyokong buku teks digital." 310 responden menjawab secara sukarela melalui pautan yang dikongsi dalam kumpulan itu.'],
    b:['Tinjauan sebuah institut penyelidikan', '"54% guru menyokong buku teks digital." 2,400 guru dipilih secara rawak dari semua negeri.'],
    q:'Sumber manakah lebih wajar digunakan untuk menggambarkan pandangan guru secara umum, dan mengapa?',
    o:['Sumber A, kerana peratusnya lebih tinggi dan lebih meyakinkan.',
       'Kedua-duanya sama wajar kerana kedua-duanya meninjau guru.',
       'Sumber B, kerana respondennya dipilih secara rawak dan lebih ramai, manakala responden Sumber A memilih sendiri untuk menjawab dalam satu kumpulan.',
       'Tiada satu pun, kerana angka tinjauan sentiasa berbeza.'], key:2,
    w:'Perbezaan 92% dan 54% berpunca daripada cara responden dipilih. Responden sukarela dalam satu kumpulan cenderung berkongsi pandangan yang sama, jadi Sumber A tidak mewakili semua guru. Sampel rawak yang lebih besar dalam Sumber B lebih wajar.'},
   {isu:'Kenyataan seorang pengetua tentang kerja rumah',
    a:['Tangkap layar yang tular di WhatsApp', '"Pengetua: Kerja rumah tidak perlu diberikan."'],
    b:['Teks penuh ucapan pengetua di laman rasmi sekolah', '"Kerja rumah tidak perlu diberikan pada minggu peperiksaan supaya murid dapat mengulang kaji. Pada minggu lain, kerja rumah diteruskan seperti biasa."'],
    q:'Apakah isu ketepatan pada Sumber A?',
    o:['Petikan itu benar tetapi dipotong daripada konteksnya, lalu maksudnya berubah.',
       'Petikan itu direka sepenuhnya dan tidak pernah diucapkan.',
       'Tiada isu, kerana perkataan itu memang diucapkan oleh pengetua.',
       'Sumber B kurang boleh dipercayai kerana teksnya lebih panjang.'], key:0,
    w:'Perkataan dalam Sumber A memang diucapkan, tetapi syarat "pada minggu peperiksaan" telah dibuang. Petikan yang tepat perkataannya masih boleh mengelirukan apabila konteksnya ditinggalkan. Rujuk teks penuh sebelum berkongsi.'},
   {isu:'Kehadiran murid dari Januari ke Februari',
    a:['Infografik di media sosial', 'Graf garis bertajuk "Kehadiran murid jatuh menjunam!". Paksi-Y graf itu bermula pada 94% dan berakhir pada 96%.'],
    b:['Jadual data kehadiran sekolah', 'Januari: 95.8%. Februari: 94.6%.'],
    q:'Apakah tafsiran paling tepat apabila kedua-dua sumber ini dibandingkan?',
    o:['Kehadiran merosot dengan teruk, seperti yang ditunjukkan oleh Sumber A.',
       'Sumber A memalsukan data kerana grafnya tidak sama dengan jadual.',
       'Graf dan jadual tidak boleh dibandingkan kerana formatnya berbeza.',
       'Datanya sepadan: penurunan hanya 1.2 mata peratus. Paksi-Y yang sempit dalam Sumber A membesarkan kesan visualnya.'], key:3,
    w:'Kedua-dua sumber menggunakan data yang sama. Penurunan daripada 95.8% kepada 94.6% ialah 1.2 mata peratus, tetapi paksi-Y yang hanya meliputi 94% hingga 96% menjadikannya kelihatan seperti kejatuhan besar.'},
   {isu:'Kajian tentang pembelajaran teradun dan motivasi murid',
    a:['Jawapan AI generatif', '"Menurut kajian bertajuk Kesan Pembelajaran Teradun terhadap Motivasi Murid (2022), motivasi murid meningkat 40%." Jawapan itu disertakan nama jurnal dan nombor DOI.'],
    b:['Semakan di indeks jurnal dan doi.org', 'Tiada artikel dengan judul itu ditemui dalam jurnal yang dinamakan. Nombor DOI yang diberikan tidak wujud.'],
    q:'Apakah tindakan paling tepat?',
    o:['Jangan petik. Anggap sitasi itu rekaan sehingga artikel asalnya ditemui dan dibaca.',
       'Petik kajian itu, kerana AI memberi judul, tahun, jurnal dan DOI yang lengkap.',
       'Tanya AI yang sama sekali lagi, dan petik jika AI mengesahkannya.',
       'Petik angka 40% itu dengan nota "sumber: AI".'], key:0,
    w:'AI generatif boleh menghasilkan sitasi yang kelihatan lengkap tetapi tidak wujud. Sumber B menunjukkan artikel dan DOI itu tidak dapat disahkan, jadi angka 40% tidak boleh dipetik. Pengesahan mesti dibuat pada sumber asal, bukan pada AI.'}]
 },
 bias: {
  n:3, name:'Bias', q:'Ke arah mana maklumat ini cuba memandu saya?', file:'unit3-bias',
  intro:'Unit ini melatih anda mengenal pasti kecondongan dalam maklumat dan dalam diri sendiri. Maklumat yang sah dan tepat masih boleh disampaikan secara berat sebelah.',
  objs:['Menerangkan cara algoritma membentuk suapan.','Mengesan data terpilih dan maklumat yang disembunyikan.','Menilai konflik kepentingan.','Mengenal pasti bahasa berbingkai.','Mengawal bias pengesahan kendiri.'],
  hook:{s:'Dua portal melaporkan cadangan yang sama. Portal X: "Langkah Proaktif Sekolah Korbankan Masa Demi Kecemerlangan Murid". Portal Y: "Rejim Sekolah Tindas Waktu Rehat & Kesihatan Mental Anak-Anak".',
        q:'Portal manakah yang melaporkan secara neutral?', o:['Portal X','Portal Y','Tiada'],
        r:'Tiada. Kedua-duanya memilih perkataan beremosi untuk memandu tafsiran pembaca sebelum fakta dinilai. Faktanya hanya satu: sekolah mencadangkan lanjutan waktu kelas tambahan.'},
  script:['Maklumat yang sah dan tepat masih boleh disampaikan berat sebelah.','Algoritma menyuap apa yang anda suka. Suapan anda bukan pandangan semua guru.','Pemilihan data: tiga contoh yang benar bukan gambaran penuh. Tanya apa yang tidak ditunjukkan.','Tajaan: tanya siapa membiayai dan siapa mendapat untung, kemudian banding dengan kajian bebas.','Pembingkaian: perkataan beremosi memandu tafsiran. Tulis semula tajuk secara neutral.','Bias pengesahan kendiri: laporkan juga bukti yang menentang pandangan anda.','Ringkasan lima soalan bias untuk menguji sebarang maklumat.'],
  topics:[
   ['3.1','Bias algoritma & gelembung tapisan','Suapan diperibadikan mengikut sejarah interaksi. Apa yang sohor kini bukan pandangan majoriti.','Audit suapan sendiri; cari sumber dengan pandangan berbeza'],
   ['3.2','Bias pemilihan data','Cherry-picking, maklumat yang ditinggalkan dan sampel terpencil.','Tanya: apa yang tidak ditunjukkan?'],
   ['3.3','Konflik kepentingan & tajaan','Siapa yang membiayai dan siapa yang mendapat untung daripada kesimpulan itu.','Baca bahagian pembiayaan dan penafian; banding dengan kajian bebas'],
   ['3.4','Pembingkaian & bahasa beremosi','Diksi beremosi, tajuk sensasi dan pelabelan.','Tulis semula tajuk secara neutral'],
   ['3.5','Bias pengesahan kendiri','Kecenderungan memilih bukti yang menyokong pandangan sendiri.','Cari sekurang-kurangnya satu bukti menentang sebelum membuat kesimpulan']],
  act:{name:'Dua Tajuk, Satu Fakta', d:'Kenal pasti jenis bias yang paling ketara dalam setiap situasi, kemudian tulis semula satu tajuk secara neutral.', o:['Algoritma','Pemilihan data','Tajaan','Pembingkaian','Pengesahan kendiri'],
   items:[
    {t:'Tajuk berita: "Guru Murka! Dasar Baharu Dikecam Hebat".', a:3, w:'Perkataan "murka" dan "dikecam hebat" memandu emosi pembaca sebelum fakta dasar itu diterangkan.'},
    {t:'Laporan keberkesanan sebuah aplikasi pembelajaran diterbitkan dan dibiayai sepenuhnya oleh syarikat pemilik aplikasi itu.', a:2, w:'Penerbit mendapat untung daripada kesimpulan positif. Dapatan perlu dibandingkan dengan kajian bebas.'},
    {t:'Brosur program memaparkan 5 murid yang cemerlang tetapi tidak menyebut 120 murid lain yang tidak menunjukkan perubahan.', a:1, w:'Kes yang menyokong ditonjolkan manakala dapatan majoriti disembunyikan.'},
    {t:'Untuk kertas cadangan, anda menaip "bukti kerja rumah tidak berguna" di enjin carian dan memetik lima hasil teratas.', a:4, w:'Kata kunci carian itu sendiri hanya menemukan bukti yang anda sudah setuju.'}],
   write:{l:'Tulis semula tajuk pertama di atas secara neutral', k:'neutral'}},
  quiz:[
   {q:'Selepas menonton beberapa video tentang kelemahan sistem peperiksaan, suapan TikTok Cikgu Lina dipenuhi kandungan serupa. Apakah tindakan paling wajar sebelum beliau membuat kesimpulan tentang pandangan umum guru?',
    o:['Mengira jumlah tontonan video-video tersebut sebagai ukuran sokongan.','Menyimpulkan bahawa majoriti guru sependapat kerana kandungan itu terus muncul.','Merujuk tinjauan bebas yang bersampel besar dan sumber dengan pelbagai perspektif.','Berhenti menggunakan media sosial sepenuhnya.'], key:2,

  </div>`;
}

/* ================= GOOGLE SHEET ================= */
// SHEET_URL: alamat "Web app" Apps Script yang menulis ke Google Sheet (lihat apps-script/Code.gs). Kosong = data kekal di pelayar sahaja.
const SHEET_URL = 'https://script.google.com/macros/s/AKfycbyC10VsZEusqOeyEap3XUII_YJdmmLQnib78pj0yY1r-guKytcqwOxzID6ULwAuw3dyDQ/exec';
let sending = false;
// record: tambah satu baris ke giliran, kemudian cuba hantar. Baris yang gagal dihantar dicuba semula pada lawatan seterusnya.
function record(jenis, data) {
  if (!SHEET_URL) return;
  if (!S.pid) S.pid = 'P-' + Math.random().toString(36).slice(2, 10).toUpperCase();   // ID rawak bagi setiap pelayar
  S.queue = (S.queue || []).concat([Object.assign({masa:new Date().toISOString(), id:S.pid, nama:S.nama || '', jenis}, data)]).slice(-50);
  save(); flush();
}
async function flush() {
  if (!SHEET_URL || sending || !(S.queue || []).length) return;
  sending = true; const n = S.queue.length;
  try {
    await fetch(SHEET_URL, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({rows:S.queue.slice(0, n)})});
    S.queue.splice(0, n); save();
  } catch (e) {}
  sending = false;
}

/* ================= SUARA NARATIF ================= */
// Voice: membaca ayat narasi. Cuba suara Claude (keupayaan "tts") dahulu; jika tiada, suara Bahasa Melayu pada peranti; jika tiada juga, kapsyen sahaja.
const Voice = (() => {
  let tts = null, web = null, mode = null, ready = null;
  const quiet = f => { try { const r = f(); if (r && r.catch) r.catch(() => {}); } catch (e) {} };
  function init() {
    if (ready) return ready;
    ready = (async () => {
      try { if (window.claude && window.claude.use) { tts = await window.claude.use('tts'); if (tts) return mode = 'claude'; } } catch (e) {}
      try {
        if ('speechSynthesis' in window) {
          const pick = () => speechSynthesis.getVoices().find(v => /^ms/i.test(v.lang));
          web = pick();
          if (!web) { await new Promise(r => { speechSynthesis.addEventListener('voiceschanged', r, {once:true}); setTimeout(r, 1500); }); web = pick(); }
          if (web) return mode = 'web';
        }
      } catch (e) {}
      return mode = 'none';
    })();
    return ready;
  }
  return {
    init, get mode() { return mode; },
    say(x) {
      if (mode === 'claude') quiet(() => tts.add([{text:x, language:'ms'}]));   // add() beratur selepas ayat semasa
      else if (mode === 'web') quiet(() => { const u = new SpeechSynthesisUtterance(x); u.voice = web; u.lang = web.lang; speechSynthesis.speak(u); });
    },
    pause()  { if (mode === 'claude') quiet(() => tts.pause());  else if (mode === 'web') quiet(() => speechSynthesis.pause()); },
    resume() { if (mode === 'claude') quiet(() => tts.resume()); else if (mode === 'web') quiet(() => speechSynthesis.resume()); },
    stop()   { if (mode === 'claude') quiet(() => tts.stop());   else if (mode === 'web') quiet(() => speechSynthesis.cancel()); }
  };
})();
function voiceLabel() {
  const b = $('#vbtn'), st = $('#vstat'); if (!b) return;
  b.textContent = 'Suara naratif: ' + (S.suara ? 'hidup' : 'mati'); b.setAttribute('aria-pressed', S.suara); b.hidden = Voice.mode === 'none';
  st.textContent = Voice.mode === null ? 'Menyemak sokongan suara…' : Voice.mode === 'none' ? 'Suara tidak disokong pada pelayar ini. Kapsyen penuh ada dalam video.' : 'Narasi Bahasa Malaysia dimainkan seiring dengan video.';
}
// wireVoice: apabila video sampai ke masa sesuatu ayat, ayat itu dibaca; berhenti, sambung dan lompat mengikut video.
function wireVoice(v, d) {
  const cues = CUES[d]; let idx = 0;
  const jump = () => { Voice.stop(); idx = cues.findIndex(c => c.t >= v.currentTime - 0.3); if (idx < 0) idx = cues.length; };
  v.addEventListener('timeupdate', () => { if (v.paused || v.seeking) return; while (idx < cues.length && cues[idx].t <= v.currentTime) { if (S.suara) Voice.say(cues[idx].x); idx++; } });
  v.addEventListener('seeking', jump);
  v.addEventListener('pause', () => { if (!v.ended) Voice.pause(); });
  v.addEventListener('play', () => Voice.resume());
  voiceLabel();
}

/* ================= LALUAN & PERISTIWA ================= */
const ROUTES = {'utama':vHome, 'unit-kesahan':() => vUnit('kesahan'), 'unit-ketepatan':() => vUnit('ketepatan'), 'unit-bias':() => vUnit('bias'), 'kit-alat':vKit, 'keputusan':vResult};
const route = () => { const h = location.hash.replace('#', ''); return ROUTES[h] ? h : 'utama'; };
const curUnit = () => route().startsWith('unit-') ? route().slice(5) : null;

function renderNav() {
  const r = route();
  const items = [['utama','Utama',''], ...ORDER.map(d => ['unit-' + d, U[d].name, passed(d) ? 'done' : '']),
    ['kit-alat','Kit Alat',null], ['keputusan','Keputusan', allPassed() ? 'done' : '']];
  $('#nav').innerHTML = items.map(([h, t, s]) => `<a href="#${h}" ${h === r ? 'aria-current="page"' : ''}>${s === null || h === 'utama' ? '' : `<span class="st ${s}"></span>`}${t}</a>`).join('');
}
function render(keepScroll) {
  $('#app').innerHTML = ROUTES[route()]();
  renderNav();
  const src = $('video source');
  if (src) src.addEventListener('error', () => { $('#vfail').hidden = false; });
  document.querySelectorAll('.ticon img').forEach(im => { const rm = () => im.remove(); im.addEventListener('error', rm); if (im.complete && !im.naturalWidth) rm(); });
  document.body.classList.toggle('has-cert', !!$('#cert'));
  if ($('#cetakNote') && window.claude) $('#cetakNote').hidden = false;
  Voice.stop();
  if ($('video')) wireVoice($('video'), curUnit());
  if (!keepScroll) window.scrollTo(0, 0);
}
function part(id, html) { const el = document.getElementById(id); if (el) el.innerHTML = html; renderNav(); }

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, k = +b.dataset.k, i = +b.dataset.i, d = curUnit();
  if (act === 'cetak') { try { window.print(); } catch (err) {} }
  else if (act === 'voice') { S.suara = !S.suara; save(); if (!S.suara) Voice.stop(); voiceLabel(); }
  else if (act === 'hook') { S.hook[d] = k; save(); part('hook', hHook(d)); }
  else if (act === 'act') { const ak = U[d].act.key || d; (S.act[ak] = S.act[ak] || [])[i] = k; save(); part('act', hAct(d)); }
  else if (act === 'act-reset') { S.act[U[d].act.key || d] = []; save(); part('act', hAct(d)); }
  else if (act === 'quiz-pick') { S.unit[d].ans[i] = k; save(); part('quiz', hQuiz(d)); }
  else if (act === 'quiz-check') { const st = S.unit[d]; st.checked = true; const sc = U[d].quiz.reduce((s, q, j) => s + (st.ans[j] === q.key ? 1 : 0), 0); st.best = Math.max(st.best === null ? 0 : st.best, sc); save(); ensureCert(); record('penilaian', {unit:U[d].name, skor:sc, menguasai:sc >= PASS ? 'Ya' : 'Tidak', jawapan:U[d].quiz.map((_, j) => LET[st.ans[j]]).join('')}); part('quiz', hQuiz(d)); }
  else if (act === 'quiz-redo') { S.unit[d].ans = []; S.unit[d].checked = false; save(); part('quiz', hQuiz(d)); document.getElementById('quiz').scrollIntoView({block:'start'}); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.text) { S.text[t.dataset.text] = t.value; save(); }
  if (t.id === 'nama') { S.nama = t.value; save(); $('#certName').textContent = t.value || ' '; $('#cetakBtn').disabled = !t.value.trim(); }
});
let armed = false;
document.addEventListener('change', e => {   // hantar teks apabila peserta selesai menaip
  const t = e.target;
  if (t.dataset.text && t.value.trim()) record(t.dataset.text === 'refleksi' ? 'refleksi' : 'tajuk neutral', {teks:t.value.trim()});
  if (t.id === 'nama' && t.value.trim()) record('sijil', {teks:certNo()});
});
$('#resetBtn').addEventListener('click', e => {
  if (!armed) { armed = true; e.target.textContent = 'Pasti? Klik sekali lagi untuk padam semua kemajuan'; setTimeout(() => { armed = false; e.target.textContent = 'Set semula kemajuan'; }, 4000); return; }
  armed = false; S = fresh(); save(); e.target.textContent = 'Set semula kemajuan'; location.hash = 'utama'; render();
});
window.addEventListener('hashchange', () => render());
render();
Voice.init().then(voiceLabel);
if (SHEET_URL) { $('#footNote').textContent = 'Kemajuan disimpan pada pelayar ini. Skor penilaian, refleksi dan nama pada sijil dihantar ke Google Sheet penyelaras.'; flush(); }
</script>
